<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash - BetYouWon't</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Bet<span>You</span>Won't</div>
        <a href="../index.html">← Terug</a>
        <div class="balance">Saldo: <span id="balanceDisplay">€1000</span></div>
    </header>

    <main class="game-page">
        <h1>Crash</h1>
        <p>Cash out voordat de grafiek crasht. Hoe langer je wacht, hoe hoger de winst — maar ook hoe groter het risico.</p>

        <div class="crash-wrapper">
            <canvas id="crashCanvas" width="500" height="300"></canvas>
            <div class="multiplier-display" id="multiplierDisplay">1.00x</div>
        </div>

        <div class="bet-controls">
            <label for="betInput">Inzet: €</label>
            <input type="number" id="betInput" value="10" min="1">
            <button id="startBtn" class="btn-primary">Start ronde</button>
            <button id="cashoutBtn" class="btn-secondary" disabled>Cash Out</button>
        </div>

        <p id="resultMessage"></p>
    </main>

    <script src="../balance.js"></script>
    <script src="crash.js"></script>
</body>
</html>
